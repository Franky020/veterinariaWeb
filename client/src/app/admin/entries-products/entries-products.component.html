<h1 class="mat-h1">E N T R A D A S &nbsp; | &nbsp; P R O D U C T O S</h1>

<mat-card class="dashboard-card">
    <mat-card-header *ngIf="!isadd && !isedit">
        <mat-card-title>
        </mat-card-title>
        <div class="container">
            <div class="c-item">
                <button mat-raised-button class="add-btn" (click)="addProduct()">Agregar nuevo (+)</button>
            </div>
            <div class="c-item">
                <div class="search-container">
                    <mat-form-field class="search-input">
                        <mat-icon matPrefix>search</mat-icon>
                        <input matInput placeholder="Search">
                    </mat-form-field>
                </div>
            </div>
        </div>
        
    </mat-card-header>
    <br>
    
    <mat-card-content>
        <mat-card class="dashboard-card" *ngIf="!isadd && !isedit">
            <mat-card-content class="dashboard-card-content">
                <div></div>
                <div class="mat-elevation-z8">
                    <table mat-table [dataSource]="dataSource" class="main-table">

                        <!-- Id Column -->
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef> ID </th>
                            <td mat-cell *matCellDef="let element"> {{element._id}} </td>
                        </ng-container>

                        <!-- Service name Column -->
                        <ng-container matColumnDef="product">
                            <th mat-header-cell *matHeaderCellDef> Producto </th>
                            <td mat-cell *matCellDef="let element"> {{element.product.product}} </td>
                        </ng-container>


                        <!-- Price Column -->
                        <ng-container matColumnDef="price">
                            <th mat-header-cell *matHeaderCellDef> Precio </th>
                            <td mat-cell *matCellDef="let element"> {{element.price}} </td>
                        </ng-container>


                        <!-- Quantity Column -->
                        <ng-container matColumnDef="quantity">
                            <th mat-header-cell *matHeaderCellDef> Cantidad </th>
                            <td mat-cell *matCellDef="let element"> {{element.quantity}} </td>
                        </ng-container>


                    


                        <!-- Price Column -->
                        <ng-container matColumnDef="total">
                            <th mat-header-cell *matHeaderCellDef> Total</th>
                            <td mat-cell *matCellDef="let element"> {{element.total}} </td>
                        </ng-container>

                        <!-- Price Column -->
                        <ng-container matColumnDef="date">
                            <th mat-header-cell *matHeaderCellDef> Fecha</th>
                            <td mat-cell *matCellDef="let element"> {{element.date}} </td>
                        </ng-container>
                        

                        

                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
                    </table>
                    <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons class="paginator">

                    </mat-paginator>

                </div>
            </mat-card-content>

        </mat-card>

        <form [formGroup]="entriesForm" *ngIf="isadd  " (ngSubmit)="saveEntry()">
            <mat-card style="width: 90%;" class="dashboard-card">
                <mat-card-header>
                    <h2 *ngIf="isadd">Nueva entrada</h2>

                </mat-card-header>

                <input class="invisible" matInput placeholder="Nombre de la categoria" formControlName="id"
                    [(ngModel)]="entry.id">
                <mat-card-content>
                    <mat-form-field appearance="fill" class="example-fill-width">
                        <mat-label>Producto</mat-label>
                        <!-- <input matInput placeholder="Nombre del producto" formControlName="product"
                            [(ngModel)]="entry.product"> -->
                            <select matNativeControl formControlName="product" [(ngModel)]="entry.product">
                                <option *ngFor="let product of products" [value]="product._id">{{product.product}}</option>
                              </select>
                    </mat-form-field>


                    <mat-form-field appearance="fill" class="example-fill-width">
                        <mat-label>Precio</mat-label>
                        <input matInput class="example-right-align" placeholder="Precio" formControlName="price" [(ngModel)]="entry.price">
                        <span matTextPrefix>$&nbsp;</span>
                        <span matTextSuffix>.00</span>
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="example-fill-width">
                        <mat-label>Cantidad</mat-label>
                        <input matInput placeholder="Cantidad" formControlName="quantity"
                            [(ngModel)]="entry.quantity">
                    </mat-form-field>

                    <!-- <mat-form-field appearance="fill" class="example-fill-width">
                        <mat-label>Total</mat-label>
                        <input matInput placeholder="Total" formControlName="total"
                            [(ngModel)]="entry.total">
                    </mat-form-field>

                    <mat-form-field appearance="fill" class="example-fill-width">
                        <mat-label>Fecha</mat-label>
                        <input matInput placeholder="Fecha" formControlName="date"
                            [(ngModel)]="entry.date">
                    </mat-form-field> -->




                </mat-card-content>
                <mat-card-actions>
                    <a mat-raised-button (click)="backtolist()">Cancelar</a>
                    <button mat-raised-button color="primary" type="submit">Guardar</button>
                </mat-card-actions>
            </mat-card>
        </form>


    </mat-card-content>
</mat-card>
