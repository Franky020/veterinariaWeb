<h1 class="mat-h1">D U E Ñ O S &nbsp; D E &nbsp; M A S C O T A S</h1>
<div class="container">
    <div class="column1">
        <mat-card>
            <h2> Datos personales</h2>
            <div style="display: flex; justify-content: center;">
                <img [src]="owner.image" alt="Imagen Dueño" class="scaled-image">
            </div>
            <br>
            <h1>Nombre: {{owner.name}}{{owner.lastName}}</h1>
            <p>Teléfono : {{owner.phone}}</p>
            <!-- <p>Correo : {{owner.email}}</p> -->
            <mat-card-actions>
                <button mat-raised-button color="primary" routerLink="/admin/owners">Ir a Dueños</button>
            </mat-card-actions>
        </mat-card>
    </div>
    <div class="column2">

    <ng-container *ngFor="let pet of pets">
        <mat-card class="card">
            <div class="container">
                <div class="column1b">
                    <img [src]="pet.details.image" alt="Imagen Producto" class="scaled-imagePet">
                </div>
                <div class="column2b">
                    <mat-card-header>
                        <h3>{{ pet.details.name }}</h3>
                    </mat-card-header>
                    <p>Edad: {{ pet.details.age }} años</p>
                    <p>Raza: {{ pet.specie }}</p>
                    <p>Sexo: {{ pet.details.gender }}</p>
                    <mat-card-actions>
                        <button mat-raised-button color="accent" (click)="detailsPet(pet._id)">Ver detalles</button>
                    </mat-card-actions>
                </div>
            </div>
        </mat-card>
    </ng-container>
</div>
