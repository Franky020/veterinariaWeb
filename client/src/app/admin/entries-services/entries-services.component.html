<h1 class="mat-h1">E N T R A D A S &nbsp; | &nbsp; S E R V I C I O S</h1>

<mat-card class="dashboard-card">
    <mat-card-header *ngIf="!isadd && !isedit">
        <mat-card-title>
        </mat-card-title>

        <button mat-raised-button class="add-btn" (click)="addService()">Agregar nuevo (+)</button>
    </mat-card-header>
    <br>
    <mat-card-content>
        <mat-card class="dashboard-card" *ngIf="!isadd && !isedit">
            <mat-card-content class="dashboard-card-content">
                <div></div>
                <div class="mat-elevation-z8">
                    <table mat-table [dataSource]="dataSource" class="main-table">

                        <!-- Id Column -->
                        <ng-container matColumnDef="id">
                            <th mat-header-cell *matHeaderCellDef> ID </th>
                            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
                        </ng-container>

                        <!-- Service name Column -->
                        <ng-container matColumnDef="service">
                            <th mat-header-cell *matHeaderCellDef> Servicio </th>
                            <td mat-cell *matCellDef="let element"> {{element.service}} </td>
                        </ng-container>

                        <!-- Description Column -->
                        <ng-container matColumnDef="description">
                            <th mat-header-cell *matHeaderCellDef> Descripción </th>
                            <td mat-cell *matCellDef="let element"> {{element.description}} </td>
                        </ng-container>

                        <!-- Price Column -->
                        <ng-container matColumnDef="price">
                            <th mat-header-cell *matHeaderCellDef> Precio </th>
                            <td mat-cell *matCellDef="let element"> {{element.price}} </td>
                        </ng-container>

                        <!-- status act/inact Column -->
                        <!-- <ng-container matColumnDef="state">
                            <th mat-header-cell *matHeaderCellDef> Estado </th>
                            <td mat-cell *matCellDef="let element"> {{element.state}} </td>
                        </ng-container> -->




                        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                        <tr mat-row *matRowDef="let row; columns:displayedColumns"></tr>
                    </table>
                    <mat-paginator [pageSizeOptions]="[5,10,20]" showFirstLastButtons class="paginator">

                    </mat-paginator>

                </div>
            </mat-card-content>

        </mat-card>

        <form [formGroup]="servicesForm" *ngIf="isadd  " >
      <mat-card style="width: 90%;" class="dashboard-card">
        <mat-card-header>
          <h2 *ngIf="isadd">Nueva entrada</h2>

        </mat-card-header>
     
          <input class="invisible" matInput placeholder="Nombre de la categoria" formControlName="id"
            [(ngModel)]="service.id">
            <mat-card-content>
          <mat-form-field appearance="fill" class="example-fill-width">
            <mat-label>Servicio</mat-label>
            <input matInput placeholder="Nombre del servicio" formControlName="service" [(ngModel)]="service.service">
          </mat-form-field>

          <mat-form-field appearance="fill" class="example-fill-width">
            <mat-label>Descripcion</mat-label>
            <input matInput placeholder="Descripcion" formControlName="description" [(ngModel)]="service.description">
          </mat-form-field>

          <mat-form-field appearance="fill" class="example-fill-width">
            <mat-label>Precio</mat-label>
            <input matInput class="example-right-align" placeholder="Precio" formControlName="price" [(ngModel)]="service.price">
            <span matTextPrefix>$&nbsp;</span>
            <span matTextSuffix>.00</span>
          </mat-form-field>

         

          
            

        </mat-card-content>
        <mat-card-actions>
          <a mat-raised-button (click)="backtolist()">Cancelar</a>
          <button mat-raised-button color="primary" type="submit">Guardar</button>
        </mat-card-actions>
      </mat-card>
    </form>


    </mat-card-content>
</mat-card>
