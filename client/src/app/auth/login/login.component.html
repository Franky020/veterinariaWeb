<div class="container">
   
        <div class="row">
            <div class="col-12 col-md-6">
                <img src="assets/images/vetB8.png" class="img-fluid image-format" alt="Bigotes Pet">
            </div>
            <div class="col-12 col-md-5">
                <mat-card class="format-card">
                    <div class="card-header">
                        <img src="assets/images/logovet.png" alt="Bigotes Pet" class="logo">
                        <br>
                    </div>
                    <div class="card-body">

                        <h1 class="title">Iniciar sesión</h1>
                        <span class="subtitle">Por favor ingresa tus credenciales para iniciar sesión.</span>
                       
                        <form class="login-form">
                            
                            <div class="form-group">
                                <label for="email">Correo electrónico</label>
                                <input type="email" class="form-control" id="email" placeholder="persona@correo.com">
                            </div>
                            <div class="form-group">
                                <label for="password">Contraseña</label>
                                <input type="password" class="form-control" id="password" placeholder="Ingresa una contraseña">
                            </div>
                            <button type="submit" class="btn btn-primary" routerLink="/admin">Iniciar sesión</button>
                        </form>
                    </div>
                </mat-card>


            </div>
        </div>
  
</div>
